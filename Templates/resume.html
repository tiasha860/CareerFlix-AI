<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CareerFlix AI - Resume Analyzer</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #05080e;
            color: white;
            font-family: Arial, sans-serif;
        }

        /* NAVBAR */

        .navbar {
            height: 75px;

            display: flex;
            align-items: center;

            padding: 0 5%;

            background: #070a10;

            border-bottom: 1px solid #202631;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        .logo span {
            color: #ff3048;
        }

        .back {
            margin-left: auto;

            color: #ccc;

            text-decoration: none;
        }

        /* MAIN */

        .container {

            max-width: 1000px;

            margin: auto;

            padding: 60px 30px;
        }

        .title {

            font-size: 45px;

            margin-bottom: 10px;
        }

        .title span {
            color: #ff3048;
        }

        .subtitle {

            color: #929aa8;

            font-size: 17px;

            margin-bottom: 40px;
        }

        /* PANEL */

        .panel {

            background: #101722;

            border: 1px solid #293342;

            border-radius: 15px;

            padding: 30px;

            margin-bottom: 25px;
        }

        .panel h2 {

            margin-bottom: 25px;

            font-size: 21px;
        }

        /* UPLOAD */

        .upload-box {

            border: 2px dashed #414b5b;

            border-radius: 12px;

            padding: 45px 20px;

            text-align: center;

            cursor: pointer;
        }

        .upload-icon {

            font-size: 45px;

            margin-bottom: 15px;
        }

        .upload-box p {

            color: #a5adba;

            margin-bottom: 15px;
        }

        input[type="file"] {

            color: white;
        }

        /* INPUTS */

        label {

            display: block;

            margin-bottom: 8px;

            color: #dce0e7;
        }

        input,
        select,
        textarea {

            width: 100%;

            background: #080c13;

            color: white;

            border: 1px solid #303a48;

            border-radius: 8px;

            padding: 14px;

            margin-bottom: 22px;

            font-size: 15px;
        }

        textarea {

            height: 180px;

            resize: vertical;
        }

        /* BUTTON */

        .analyze-btn {

            width: 100%;

            padding: 16px;

            background: #ff3048;

            color: white;

            border: none;

            border-radius: 30px;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }

        .analyze-btn:hover {

            background: #e9233b;

        }

        .hint {

            color: #747e8e;

            font-size: 12px;

            margin-top: 10px;

        }

    </style>

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar">

    <div class="logo">
        Career<span>Flix</span> AI
    </div>

    <a href="/" class="back">
        ← Back to Home
    </a>

</nav>


<!-- MAIN -->

<div class="container">


    <h1 class="title">

        AI <span>Resume Analyzer</span>

    </h1>


    <p class="subtitle">

        Make your resume ready for your target company
        and job role.

    </p>


    <form
        action="/analyze-resume"
        method="POST"
        enctype="multipart/form-data">


        <!-- RESUME -->

        <div class="panel">

            <h2>
                📄 Upload Your Resume
            </h2>


            <div class="upload-box">

                <div class="upload-icon">
                    📄
                </div>

                <p>
                    Upload your resume in PDF format
                </p>

                <input
                    type="file"
                    name="resume"
                    accept=".pdf"
                    required>

            </div>


            <p class="hint">
                Supported format: PDF
            </p>

        </div>


        <!-- TARGET JOB -->

        <div class="panel">

            <h2>
                🎯 Target Job
            </h2>


            <label>
                Company
            </label>

            <select name="company" required>

                <option value="">
                    Select Company
                </option>

                <option value="Google">
                    Google
                </option>

                <option value="Microsoft">
                    Microsoft
                </option>

                <option value="Amazon">
                    Amazon
                </option>

                <option value="TCS">
                    TCS
                </option>

                <option value="Infosys">
                    Infosys
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <label>
                Job Role
            </label>

            <input
                type="text"
                name="job_role"
                placeholder="Example: Machine Learning Engineer"
                required>


            <label>
                Job Description
            </label>

            <textarea
                name="job_description"
                placeholder="Paste the job description here..."
                required></textarea>


            <button
                type="submit"
                class="analyze-btn">

                🤖 Analyze My Resume

            </button>

        </div>


    </form>


</div>


</body>

</html>
